# =============================================================================
# SONARQUBE / SONARCLOUD CONFIGURATION - AUTOREPAROS (OFICIAL)
# =============================================================================
# Configuração raiz unificada para análise de código estático de todos os
# submódulos do ecossistema AutoReparos.
# =============================================================================

sonar.projectKey=AutoReparos
sonar.projectName=AutoReparos
sonar.projectVersion=1.0.0

# -----------------------------------------------------------------------------
# Diretórios de Código-Fonte (Submódulos)
# -----------------------------------------------------------------------------
sonar.sources=submodules/AutoReparos.Cadastros/AutoReparos.Cadastros.Api,submodules/AutoReparos.Cadastros/AutoReparos.Cadastros.Application,submodules/AutoReparos.Cadastros/AutoReparos.Cadastros.Domain,submodules/AutoReparos.Cadastros/AutoReparos.Cadastros.Infrastructure,submodules/AutoReparos.AuthLambda/src,submodules/AutoReparos.Web/src

# -----------------------------------------------------------------------------
# Diretórios de Testes Unitários e de Integração
# -----------------------------------------------------------------------------
sonar.tests=submodules/AutoReparos.Cadastros/AutoReparos.Cadastros.Application.Tests,submodules/AutoReparos.Cadastros/AutoReparos.Cadastros.Domain.Tests,submodules/AutoReparos.Cadastros/AutoReparos.Cadastros.IntegrationTests,submodules/AutoReparos.AuthLambda/tests

# -----------------------------------------------------------------------------
# Relatórios de Cobertura de Código e Resultados de Testes (.NET)
# -----------------------------------------------------------------------------
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml,**/TestResults/**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/TestResults/*.trx

# -----------------------------------------------------------------------------
# Exclusões de Análise e Cobertura
# -----------------------------------------------------------------------------
sonar.exclusions=**/bin/**,**/obj/**,**/Data/Migrations/**,**/dist/**,**/node_modules/**,**/coverage/**,**/*.designer.cs,**/*.g.cs
sonar.coverage.exclusions=**/*Tests/**,**/Data/Migrations/**,**/Program.cs,**/DependencyInjection*.cs,**/Swagger*.cs,**/*.spec.ts

# -----------------------------------------------------------------------------
# Codificação
# -----------------------------------------------------------------------------
sonar.sourceEncoding=UTF-8
