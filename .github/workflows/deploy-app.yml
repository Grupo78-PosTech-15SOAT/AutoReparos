name: Deploy application

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY-PRODUCTION to publish this revision
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-infrastructure-${{ vars.AWS_REGION || 'us-east-1' }}-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY-PRODUCTION'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: false
      - uses: ./.github/actions/checkout-submodules
        with:
          app-id: ${{ vars.SUBMODULES_APP_ID }}
          private-key: ${{ secrets.SUBMODULES_APP_PRIVATE_KEY }}
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.10.5
      - uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 10.0.x
      - uses: azure/setup-helm@v4.2.0
        with:
          version: v3.16.4
      - name: Read current network state outputs
        id: network
        working-directory: submodules/AutoReparos.Infra.K8s/terraform/stacks/base
        run: |
          set -euo pipefail
          terraform init -reconfigure -input=false -no-color \
            -backend-config="bucket=$TF_STATE_BUCKET" -backend-config='key=network/production/terraform.tfstate' \
            -backend-config="region=$AWS_REGION" -backend-config="dynamodb_table=$TF_LOCK_TABLE" -backend-config='encrypt=true'
          echo "vpc_id=$(terraform output -raw vpc_id)" >> "$GITHUB_OUTPUT"
          echo "private_subnet_ids=$(terraform output -json private_subnet_ids | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "lambda_security_group_id=$(terraform output -raw lambda_security_group_id)" >> "$GITHUB_OUTPUT"
          echo "ecr_api_repository_url=$(terraform output -raw ecr_api_repository_url)" >> "$GITHUB_OUTPUT"
          echo "ecr_web_repository_url=$(terraform output -raw ecr_web_repository_url)" >> "$GITHUB_OUTPUT"
          echo "cluster_name=$(terraform output -raw cluster_name)" >> "$GITHUB_OUTPUT"
      - name: Update Lambda from the registered submodule commit
        working-directory: submodules/AutoReparos.AuthLambda/infra
        env:
          TF_VAR_vpc_id: ${{ steps.network.outputs.vpc_id }}
          TF_VAR_private_subnet_ids: ${{ steps.network.outputs.private_subnet_ids }}
          TF_VAR_lambda_security_group_id: ${{ steps.network.outputs.lambda_security_group_id }}
          TF_VAR_cadastros_base_url: ${{ vars.CADASTROS_INTERNAL_URL }}
          TF_VAR_cadastros_chave_interna: ${{ secrets.CHAVE_INTERNA }}
          LAMBDA_ZIP: ${{ runner.temp }}/auth-lambda.zip
        run: |
          set -euo pipefail
          dotnet publish ../src/AutoReparos.AuthLambda.csproj -c Release -r linux-x64 --self-contained false -o "$RUNNER_TEMP/lambda-publish"
          (cd "$RUNNER_TEMP/lambda-publish" && zip -q -r "$LAMBDA_ZIP" .)
          echo "::add-mask::$TF_VAR_cadastros_chave_interna"
          terraform init -reconfigure -input=false -no-color \
            -backend-config="bucket=$TF_STATE_BUCKET" -backend-config='key=lambda-auth/terraform.tfstate' \
            -backend-config="region=$AWS_REGION" -backend-config="dynamodb_table=$TF_LOCK_TABLE" -backend-config='encrypt=true'
          if terraform state list | grep -q '^aws_security_group\.lambda_sg'; then
            echo '::error::The legacy Lambda state still owns its security group. Transfer aws_security_group.lambda_sg[0] to the network state as aws_security_group.lambda before deployment.'
            exit 1
          fi
          terraform plan -input=false -no-color -out="$RUNNER_TEMP/lambda.tfplan" \
            -var="aws_region=$AWS_REGION" -var='environment=production' -var="lambda_zip_path=$LAMBDA_ZIP"
          terraform apply -input=false -auto-approve "$RUNNER_TEMP/lambda.tfplan"
          rm -f "$RUNNER_TEMP/lambda.tfplan" "$LAMBDA_ZIP"
          unset TF_VAR_cadastros_chave_interna
      - name: Build and push API and Web images
        env:
          ECR_API: ${{ steps.network.outputs.ecr_api_repository_url }}
          ECR_WEB: ${{ steps.network.outputs.ecr_web_repository_url }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          registry="${ECR_API%%/*}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"
          docker build -t "$ECR_API:$IMAGE_TAG" -f submodules/AutoReparos.Cadastros/AutoReparos.Cadastros.Api/Dockerfile submodules/AutoReparos.Cadastros
          docker build -t "$ECR_WEB:$IMAGE_TAG" -f submodules/AutoReparos.Web/Dockerfile submodules/AutoReparos.Web
          docker push "$ECR_API:$IMAGE_TAG"
          docker push "$ECR_WEB:$IMAGE_TAG"
      - name: Connect to EKS and inject runtime secrets
        env:
          JWT_CHAVE_PRIVADA_PEM: ${{ secrets.JWT_CHAVE_PRIVADA_PEM }}
          CHAVE_INTERNA: ${{ secrets.CHAVE_INTERNA }}
          SEED_USER_PASSWORD: ${{ secrets.SEED_USER_PASSWORD }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$JWT_CHAVE_PRIVADA_PEM" "$CHAVE_INTERNA" "$SEED_USER_PASSWORD" "$GRAFANA_ADMIN_PASSWORD"; do test -n "$value" || { echo '::error::A required production secret is empty'; exit 1; }; echo "::add-mask::$value"; done
          db="$(aws secretsmanager get-secret-value --secret-id autoreparos/production/database/credentials --query SecretString --output text | jq -r '.connectionString')"
          echo "::add-mask::$db"
          aws eks update-kubeconfig --name '${{ steps.network.outputs.cluster_name }}' --region "$AWS_REGION"
          namespace='${{ vars.K8S_NAMESPACE }}'
          kubectl create namespace "$namespace" --dry-run=client -o yaml | kubectl apply -f -
          jq -n --arg namespace "$namespace" --arg db "$db" --arg jwt "$JWT_CHAVE_PRIVADA_PEM" --arg interna "$CHAVE_INTERNA" --arg seed "$SEED_USER_PASSWORD" --arg sendgrid "$SENDGRID_API_KEY" '{apiVersion:"v1",kind:"Secret",metadata:{name:"autoreparos-api-secrets",namespace:$namespace},type:"Opaque",stringData:{"ConnectionStrings__DbConnection":$db,"Jwt__ChavePrivadaPem":$jwt,"Interno__Chave":$interna,"SeedUser__Password":$seed,"SendGrid__ApiKey":$sendgrid}}' | kubectl apply -f -
          jq -n --arg namespace "$namespace" --arg password "$GRAFANA_ADMIN_PASSWORD" '{apiVersion:"v1",kind:"Secret",metadata:{name:"autoreparos-grafana-admin",namespace:$namespace},type:"Opaque",stringData:{"admin-password":$password}}' | kubectl apply -f -
          unset db JWT_CHAVE_PRIVADA_PEM CHAVE_INTERNA SEED_USER_PASSWORD SENDGRID_API_KEY GRAFANA_ADMIN_PASSWORD
      - name: Run database migrations before deployment
        env:
          API_IMAGE: ${{ steps.network.outputs.ecr_api_repository_url }}:${{ github.sha }}
        run: |
          set -euo pipefail
          namespace='${{ vars.K8S_NAMESPACE }}'
          job="migrate-${GITHUB_RUN_ID}"
          jq -n --arg namespace "$namespace" --arg name "$job" --arg image "$API_IMAGE" '
            def api_secret($key):
              {name: $key, valueFrom: {secretKeyRef: {name: "autoreparos-api-secrets", key: $key}}};
            {
              apiVersion: "batch/v1",
              kind: "Job",
              metadata: {name: $name, namespace: $namespace},
              spec: {
                backoffLimit: 0,
                activeDeadlineSeconds: 600,
                template: {
                  spec: {
                    restartPolicy: "Never",
                    containers: [{
                      name: "migrations",
                      image: $image,
                      env: [
                        {name: "Database__RunMigrations", value: "true"},
                        api_secret("ConnectionStrings__DbConnection")
                      ]
                    }]
                  }
                }
              }
            }' | kubectl apply -f -
          if ! kubectl wait --for=condition=complete "job/$job" -n "$namespace" --timeout=10m; then
            kubectl describe job "$job" -n "$namespace" || true
            kubectl describe pods -n "$namespace" -l "job-name=$job" || true
            kubectl logs "job/$job" -n "$namespace" -c migrations --tail=100 --pod-running-timeout=5s || true
            exit 1
          fi
          kubectl delete "job/$job" -n "$namespace" --wait=true
      - name: Deploy chart and verify API/Web
        env:
          ECR_API: ${{ steps.network.outputs.ecr_api_repository_url }}
          ECR_WEB: ${{ steps.network.outputs.ecr_web_repository_url }}
          SENDGRID_FROM_EMAIL: ${{ vars.SENDGRID_FROM_EMAIL }}
          SENDGRID_FROM_NAME: ${{ vars.SENDGRID_FROM_NAME }}
        run: |
          set -euo pipefail
          helm upgrade --install autoreparos submodules/AutoReparos.Infra.K8s/k8s \
            --namespace '${{ vars.K8S_NAMESPACE }}' --create-namespace \
            -f submodules/AutoReparos.Infra.K8s/k8s/values.yaml -f submodules/AutoReparos.Infra.K8s/k8s/values-production.yaml \
            --set-string api.image.repository="$ECR_API" --set-string api.image.tag='${{ github.sha }}' \
            --set-string web.image.repository="$ECR_WEB" --set-string web.image.tag='${{ github.sha }}' \
            --set-string api.config.seedUserEmail='${{ vars.SEED_USER_EMAIL }}' \
            --set-string api.config.sendGridFromEmail="$SENDGRID_FROM_EMAIL" \
            --set-string api.config.sendGridFromName="$SENDGRID_FROM_NAME" \
            --set-string api.config.jwtIssuer='${{ vars.CADASTROS_ISSUER }}' \
            --set-string api.config.notificacoesFilaUrl='${{ vars.CADASTROS_NOTIFICACOES_FILA_URL }}' \
            --set-string api.config.notificacoesDlqUrl='${{ vars.CADASTROS_NOTIFICACOES_DLQ_URL }}' \
            --set "api.networkPolicy.allowedCidrs={${{ vars.VPC_PRIVATE_CIDRS }}}" --wait --timeout 10m
          kubectl rollout status deployment/autoreparos-api -n '${{ vars.K8S_NAMESPACE }}' --timeout=10m
          kubectl rollout status deployment/autoreparos-web -n '${{ vars.K8S_NAMESPACE }}' --timeout=10m
          echo 'Registered parent/submodule revisions:' >> "$GITHUB_STEP_SUMMARY"
          git submodule status >> "$GITHUB_STEP_SUMMARY"
