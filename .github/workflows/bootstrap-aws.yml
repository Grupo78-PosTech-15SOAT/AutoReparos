name: Bootstrap AWS Terraform backend

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type CONFIRMAR-BOOTSTRAP after reviewing the target account
        required: true
        type: string
      existing_resources_reviewed:
        description: Confirm that S3 bucket/table ownership and existing state were inventoried
        required: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-infrastructure-${{ vars.AWS_REGION || 'us-east-1' }}-production
  cancel-in-progress: false

jobs:
  bootstrap:
    if: contains(fromJSON('["refs/heads/main","refs/heads/feature/provisionamento-aws-centralizado"]'), github.ref) && inputs.confirmation == 'CONFIRMAR-BOOTSTRAP' && inputs.existing_resources_reviewed
    runs-on: ubuntu-latest
    environment: aws-bootstrap
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
      - uses: ./.github/actions/checkout-submodules
        with:
          app-id: ${{ vars.SUBMODULES_APP_ID }}
          private-key: ${{ secrets.SUBMODULES_APP_PRIVATE_KEY }}
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5
      - name: Verify AWS account
        env:
          EXPECTED_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          actual="$(aws sts get-caller-identity --query Account --output text)"
          test "$actual" = "$EXPECTED_ACCOUNT" || { echo '::error::Authenticated account does not match AWS_ACCOUNT_ID'; exit 1; }
      - name: Create or recover bootstrap state and migrate it to S3
        working-directory: submodules/AutoReparos.Infra.K8s/bootstrap
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          backend_args=(
            "-backend-config=bucket=$TF_STATE_BUCKET"
            "-backend-config=key=bootstrap/terraform.tfstate"
            "-backend-config=region=$AWS_REGION"
            "-backend-config=dynamodb_table=$TF_LOCK_TABLE"
            "-backend-config=encrypt=true"
          )
          if aws s3api head-object --bucket "$TF_STATE_BUCKET" --key bootstrap/terraform.tfstate >/dev/null 2>&1; then
            using_remote=1
            terraform init -input=false -no-color "${backend_args[@]}"
          else
            using_remote=0
            terraform init -backend=false -input=false
            # Rebuild local tracking for partially created backend resources.
            # Imports only adopt objects in the configured account and exact configured names.
            if aws s3api head-bucket --bucket "$TF_STATE_BUCKET" --expected-bucket-owner "$AWS_ACCOUNT_ID" >/dev/null 2>&1; then
              terraform import -input=false aws_s3_bucket.terraform_state "$TF_STATE_BUCKET"
              if aws s3api get-bucket-versioning --bucket "$TF_STATE_BUCKET" --expected-bucket-owner "$AWS_ACCOUNT_ID" 2>/dev/null | jq -e '.Status != null' >/dev/null; then terraform import -input=false aws_s3_bucket_versioning.terraform_state_versioning "$TF_STATE_BUCKET"; fi
              if aws s3api get-bucket-encryption --bucket "$TF_STATE_BUCKET" --expected-bucket-owner "$AWS_ACCOUNT_ID" >/dev/null 2>&1; then terraform import -input=false aws_s3_bucket_server_side_encryption_configuration.terraform_state_crypto "$TF_STATE_BUCKET"; fi
              if aws s3api get-public-access-block --bucket "$TF_STATE_BUCKET" --expected-bucket-owner "$AWS_ACCOUNT_ID" >/dev/null 2>&1; then terraform import -input=false aws_s3_bucket_public_access_block.terraform_state_pab "$TF_STATE_BUCKET"; fi
              if aws s3api get-bucket-ownership-controls --bucket "$TF_STATE_BUCKET" --expected-bucket-owner "$AWS_ACCOUNT_ID" >/dev/null 2>&1; then terraform import -input=false aws_s3_bucket_ownership_controls.terraform_state_ownership "$TF_STATE_BUCKET"; fi
              if aws s3api get-bucket-policy --bucket "$TF_STATE_BUCKET" --expected-bucket-owner "$AWS_ACCOUNT_ID" >/dev/null 2>&1; then terraform import -input=false aws_s3_bucket_policy.enforce_tls "$TF_STATE_BUCKET"; fi
            fi
            if aws dynamodb describe-table --table-name "$TF_LOCK_TABLE" --region "$AWS_REGION" >/dev/null 2>&1; then terraform import -input=false aws_dynamodb_table.terraform_locks "$TF_LOCK_TABLE"; fi
          fi
          terraform plan -input=false -no-color \
            -var="aws_region=$AWS_REGION" \
            -var="state_bucket_name=$TF_STATE_BUCKET" \
            -var="lock_table_name=$TF_LOCK_TABLE" \
            -out=bootstrap.tfplan
          terraform apply -input=false -auto-approve bootstrap.tfplan
          if [ "$using_remote" -eq 0 ]; then
            terraform init -input=false -migrate-state -force-copy -no-color "${backend_args[@]}"
          fi
          rm -f bootstrap.tfplan
