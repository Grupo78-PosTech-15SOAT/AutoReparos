name: CI

on:
  pull_request:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Build and test application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
      - uses: ./.github/actions/checkout-submodules
        with:
          app-id: ${{ vars.SUBMODULES_APP_ID }}
          private-key: ${{ secrets.SUBMODULES_APP_PRIVATE_KEY }}
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore AutoReparos.slnx
      - run: dotnet build AutoReparos.slnx --no-restore -c Release
      - run: dotnet test AutoReparos.slnx --no-build -c Release

  web:
    name: Build Angular web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: submodules/AutoReparos.App/AutoReparos.Web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
      - uses: ./.github/actions/checkout-submodules
        with:
          app-id: ${{ vars.SUBMODULES_APP_ID }}
          private-key: ${{ secrets.SUBMODULES_APP_PRIVATE_KEY }}
      - uses: actions/setup-node@1e60f620b9541d0f1a2e9f6dce3b2bb6d79e3d6a # v4.0.3
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: submodules/AutoReparos.App/AutoReparos.Web/yarn.lock
      - run: corepack enable && yarn install --frozen-lockfile
      - run: yarn build

  infrastructure:
    name: Validate Terraform and Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
      - uses: ./.github/actions/checkout-submodules
        with:
          app-id: ${{ vars.SUBMODULES_APP_ID }}
          private-key: ${{ secrets.SUBMODULES_APP_PRIVATE_KEY }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5
      - uses: azure/setup-helm@fe7b1b4506d7105c267c2c78d0c8f18f8c4c0484 # v4.2.0
        with:
          version: v3.16.4
      - name: Terraform format and validate
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' dir; do
            terraform -chdir="$dir" fmt -check -recursive
            terraform -chdir="$dir" init -backend=false -input=false -no-color
            terraform -chdir="$dir" validate -no-color
          done < <(find submodules -type f -name '*.tf' -not -path '*/.terraform/*' -printf '%h\0' | sort -zu)
      - name: Helm lint and render
        shell: bash
        run: |
          set -euo pipefail
          helm lint submodules/AutoReparos.Infra.K8s/k8s
          helm template autoreparos submodules/AutoReparos.Infra.K8s/k8s \
            --namespace autoreparos \
            -f submodules/AutoReparos.Infra.K8s/k8s/values-production.yaml
          for chart in submodules/AutoReparos.Infra.K8s/k8s/charts/*; do
            helm lint "$chart"
            helm template autoreparos "$chart" --namespace autoreparos
          done
