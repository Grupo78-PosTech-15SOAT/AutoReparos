name: CI

on:
  pull_request:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Build and test application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: false
      - uses: ./.github/actions/checkout-submodules
        with:
          app-id: ${{ vars.SUBMODULES_APP_ID }}
          private-key: ${{ secrets.SUBMODULES_APP_PRIVATE_KEY }}
      - uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore AutoReparos.slnx
      - run: dotnet build AutoReparos.slnx --no-restore -c Release
      - run: dotnet test AutoReparos.slnx --no-build -c Release

  web:
    name: Build Angular web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: submodules/AutoReparos.Web
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: false
      - uses: ./.github/actions/checkout-submodules
        with:
          app-id: ${{ vars.SUBMODULES_APP_ID }}
          private-key: ${{ secrets.SUBMODULES_APP_PRIVATE_KEY }}
      - uses: actions/setup-node@v4.0.3
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: submodules/AutoReparos.Web/yarn.lock
      - run: corepack enable && yarn install --frozen-lockfile
      - run: yarn build

  infrastructure:
    name: Validate Terraform and Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: false
      - uses: ./.github/actions/checkout-submodules
        with:
          app-id: ${{ vars.SUBMODULES_APP_ID }}
          private-key: ${{ secrets.SUBMODULES_APP_PRIVATE_KEY }}
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.10.5
      - uses: azure/setup-helm@v4.2.0
        with:
          version: v3.16.4
      - name: Terraform format and validate
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' dir; do
            terraform -chdir="$dir" fmt -check -recursive
            terraform -chdir="$dir" init -backend=false -input=false -no-color
            terraform -chdir="$dir" validate -no-color
          done < <(find submodules -type f -name '*.tf' -not -path '*/.terraform/*' -printf '%h\0' | sort -zu)
      - name: Helm lint and render
        shell: bash
        run: |
          set -euo pipefail
          helm lint submodules/AutoReparos.Infra.K8s/k8s
          helm template autoreparos submodules/AutoReparos.Infra.K8s/k8s \
            --namespace autoreparos \
            -f submodules/AutoReparos.Infra.K8s/k8s/values-production.yaml
          for chart in submodules/AutoReparos.Infra.K8s/k8s/charts/*; do
            helm lint "$chart"
            helm template autoreparos "$chart" --namespace autoreparos
          done
