name: CI/CD Pipeline

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.dockerignore'
  pull_request:
    types: [ opened, reopened, synchronize ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.dockerignore'

env:
  # Região padrão da AWS
  AWS_REGION: "us-east-1"
  
  # Configurações do Aplicativo (não-sensíveis)
  SEED_USER_EMAIL: "admin@autoreparos.com"

jobs:
  # 🛠️ Bloco 1: Compilação (Restore & Build)
  compilation:
    name: Compilação (Restore & Build)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore AutoReparos.slnx

    - name: Build Application
      run: dotnet build AutoReparos.slnx --no-restore -c Release

    # Salva os binários para que os testes rodem sem precisar recompilar
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          **/bin/
          **/obj/
        retention-days: 1

  tests:
    name: Testes (Unitários & Integração)
    needs: compilation
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__DbConnection: "Host=localhost;Database=autoreparos_test;Username=admin;Password=${{ secrets.POSTGRES_PASSWORD }}"
      Jwt__Secret: ${{ secrets.JWT_SECRET }}
      Jwt__ExpiryHours: "2"
      SeedUser__Email: "admin@autoreparos.com"
      SeedUser__Password: ${{ secrets.SEED_USER_PASSWORD }}
      AprovacaoToken__Secret: ${{ secrets.APROVACAO_TOKEN_SECRET }}
      SendGrid__ApiKey: ${{ secrets.SENDGRID_API_KEY }}
      SendGrid__FromEmail: "noreply@autoreparos.com"
      SendGrid__FromName: "AutoReparos"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts

    - name: Run Unit Tests
      run: |
        dotnet test submodules/AutoReparos.App/AutoReparos.Domain.Tests/AutoReparos.Domain.Tests.csproj -c Release --no-build --verbosity normal
        dotnet test submodules/AutoReparos.App/AutoReparos.Application.Tests/AutoReparos.Application.Tests.csproj -c Release --no-build --verbosity normal
        dotnet test submodules/AutoReparos.AuthLambda/tests/AutoReparos.AuthLambda.Tests.csproj -c Release --no-build --verbosity normal

    - name: Run Integration Tests
      run: dotnet test submodules/AutoReparos.App/AutoReparos.IntegrationTests/AutoReparos.IntegrationTests.csproj -c Release --no-build --verbosity normal


  # ☁️ Bloco 3: Infraestrutura (Terraform Setup, Apply, Validação, Login, Push Image)
  infra:
    name: Infraestrutura (Terraform & ECR Push)
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ecr_repository_url: ${{ steps.tf-outputs.outputs.ecr_repository_url }}
      cluster_name: ${{ steps.tf-outputs.outputs.cluster_name }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.8.0

    - name: Terraform Validate
      working-directory: submodules/AutoReparos.Infra.K8s/terraform
      env:
        TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      run: |
        terraform init -backend-config="bucket=$TF_STATE_BUCKET"
        terraform validate

    - name: Terraform Apply
      working-directory: submodules/AutoReparos.Infra.K8s/terraform
      run: terraform apply -auto-approve

    - name: Get Terraform Outputs
      id: tf-outputs
      working-directory: submodules/AutoReparos.Infra.K8s/terraform
      run: |
        echo "ecr_repository_url=$(terraform output -raw ecr_repository_url)" >> $GITHUB_OUTPUT
        echo "cluster_name=$(terraform output -raw cluster_name)" >> $GITHUB_OUTPUT

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, Tag and Push Image to ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/autoreparos-api:$IMAGE_TAG -t $ECR_REGISTRY/autoreparos-api:latest -f submodules/AutoReparos.App/AutoReparos.API/Dockerfile submodules/AutoReparos.App
        docker push $ECR_REGISTRY/autoreparos-api:$IMAGE_TAG
        docker push $ECR_REGISTRY/autoreparos-api:latest

  # ☸️ Bloco 4: Deploy (Kubeconfig, Upgrade, Configure URL)
  deploy:
    name: Deploy (Kubernetes & Helm)
    needs: infra
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Update Kubeconfig
      run: |
        aws eks update-kubeconfig --name ${{ needs.infra.outputs.cluster_name }} --region ${{ env.AWS_REGION }}

    - name: Helm Upgrade Deploy
      env:
        SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
        SENDGRID_FROM_NAME: ${{ secrets.SENDGRID_FROM_NAME }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        SEED_USER_PASSWORD: ${{ secrets.SEED_USER_PASSWORD }}
        APROVACAO_TOKEN_SECRET: ${{ secrets.APROVACAO_TOKEN_SECRET }}
        SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      run: |
        helm upgrade --install autoreparos ./submodules/AutoReparos.Infra.K8s/k8s \
          -f submodules/AutoReparos.Infra.K8s/k8s/values.yaml \
          -f submodules/AutoReparos.Infra.K8s/k8s/values-production.yaml \
          --set image.repository=${{ needs.infra.outputs.ecr_repository_url }} \
          --set image.tag=${{ github.sha }} \
          --set config.seedUserEmail="${{ env.SEED_USER_EMAIL }}" \
          --set config.sendGridFromEmail="$SENDGRID_FROM_EMAIL" \
          --set config.sendGridFromName="$SENDGRID_FROM_NAME" \
          --set secrets.jwtSecret="$JWT_SECRET" \
          --set secrets.seedUserPassword="$SEED_USER_PASSWORD" \
          --set secrets.aprovacaoTokenSecret="$APROVACAO_TOKEN_SECRET" \
          --set secrets.sendGridApiKey="$SENDGRID_API_KEY" \
          --set postgres.password="$POSTGRES_PASSWORD"

    - name: Configure URL Display
      run: |
        echo "Application is deployed. You can retrieve the load balancer URL using:"
        echo "kubectl get ingress"

  destroy:
    name: Auto-Destroy (Terraform & Helm Cleanup)
    needs: [infra, deploy]
    if: |
      always() &&
      (needs.infra.result == 'success' || needs.infra.result == 'failure') &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Wait 15 Minutes
      run: |
        echo "Waiting 15 minutes before destroying infrastructure..."
        sleep 900

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Kubeconfig
      run: |
        aws eks update-kubeconfig --name ${{ needs.infra.outputs.cluster_name }} --region ${{ env.AWS_REGION }} || true

    - name: Uninstall Helm Release
      run: |
        # Uninstall the Helm release and wait for all resources (including load balancers) to be removed
        helm uninstall autoreparos --wait || true

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.8.0

    - name: Terraform Init
      working-directory: submodules/AutoReparos.Infra.K8s/terraform
      env:
        TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      run: |
        terraform init -backend-config="bucket=$TF_STATE_BUCKET"

    - name: Terraform Destroy
      working-directory: submodules/AutoReparos.Infra.K8s/terraform
      run: terraform destroy -auto-approve


