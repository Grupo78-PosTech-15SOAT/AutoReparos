name: CI/CD Pipeline

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.dockerignore'
  pull_request:
    types: [ opened, reopened, synchronize ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.dockerignore'

env:
  # Região padrão da AWS
  AWS_REGION: "us-east-1"
  
  # Configurações do Aplicativo (não-sensíveis)
  SEED_USER_EMAIL: "admin@autoreparos.com"

jobs:
  # 🛠️ Bloco 1: Compilação (Restore & Build)
  compilation:
    name: Compilação (Restore & Build)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Setup .NET Core
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore AutoReparos.slnx

    - name: Build Application
      run: dotnet build AutoReparos.slnx --no-restore -c Release

    # Salva os binários para que os testes rodem sem precisar recompilar
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: build-artifacts
        path: |
          **/bin/
          **/obj/
        retention-days: 1

  tests:
    name: Testes (Unitários & Integração)
    needs: compilation
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__DbConnection: "Host=localhost;Database=autoreparos_test;Username=admin;Password=${{ secrets.POSTGRES_PASSWORD }}"
      Jwt__Secret: ${{ secrets.JWT_SECRET }}
      Jwt__ExpiryHours: "2"
      SeedUser__Email: "admin@autoreparos.com"
      SeedUser__Password: ${{ secrets.SEED_USER_PASSWORD }}
      AprovacaoToken__Secret: ${{ secrets.APROVACAO_TOKEN_SECRET }}
      SendGrid__ApiKey: ${{ secrets.SENDGRID_API_KEY }}
      SendGrid__FromEmail: "noreply@autoreparos.com"
      SendGrid__FromName: "AutoReparos"

    steps:
    - name: Checkout Code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Setup .NET Core
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: '10.0.x'

    - name: Download Build Artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: build-artifacts

    - name: Run Unit Tests
      run: |
        dotnet test AutoReparos.Domain.Tests/AutoReparos.Domain.Tests.csproj -c Release --no-build --verbosity normal
        dotnet test AutoReparos.Application.Tests/AutoReparos.Application.Tests.csproj -c Release --no-build --verbosity normal

    - name: Run Integration Tests
      run: dotnet test AutoReparos.IntegrationTests/AutoReparos.IntegrationTests.csproj -c Release --no-build --verbosity normal


  # ☁️ Bloco 3: Infraestrutura (Terraform Setup, Apply, Validação, Login, Push Image)
  infra:
    name: Infraestrutura (Terraform & ECR Push)
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ecr_repository_url: ${{ steps.tf-outputs.outputs.ecr_repository_url }}
      cluster_name: ${{ steps.tf-outputs.outputs.cluster_name }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      with:
        terraform_version: 1.5.0

    - name: Terraform Validate
      working-directory: infra
      env:
        TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      run: |
        terraform init -backend-config="bucket=$TF_STATE_BUCKET"
        terraform validate

    - name: Terraform Apply
      working-directory: infra
      run: terraform apply -auto-approve

    - name: Get Terraform Outputs
      id: tf-outputs
      working-directory: infra
      run: |
        echo "ecr_repository_url=$(terraform output -raw ecr_repository_url)" >> $GITHUB_OUTPUT
        echo "cluster_name=$(terraform output -raw cluster_name)" >> $GITHUB_OUTPUT

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

    - name: Build, Tag and Push Image to ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/autoreparos-api:$IMAGE_TAG -t $ECR_REGISTRY/autoreparos-api:latest .
        docker push $ECR_REGISTRY/autoreparos-api:$IMAGE_TAG
        docker push $ECR_REGISTRY/autoreparos-api:latest

  # ☸️ Bloco 4: Deploy (Kubeconfig, Upgrade, Configure URL)
  deploy:
    name: Deploy (Kubernetes & Helm)
    needs: infra
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Update Kubeconfig
      run: |
        aws eks update-kubeconfig --name ${{ needs.infra.outputs.cluster_name }} --region ${{ env.AWS_REGION }}

    - name: Helm Upgrade Deploy
      env:
        SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
        SENDGRID_FROM_NAME: ${{ secrets.SENDGRID_FROM_NAME }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        SEED_USER_PASSWORD: ${{ secrets.SEED_USER_PASSWORD }}
        APROVACAO_TOKEN_SECRET: ${{ secrets.APROVACAO_TOKEN_SECRET }}
        SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      run: |
        helm upgrade --install autoreparos ./k8s \
          -f k8s/values.yaml \
          -f k8s/values-production.yaml \
          --set image.repository=${{ needs.infra.outputs.ecr_repository_url }} \
          --set image.tag=${{ github.sha }} \
          --set config.seedUserEmail="${{ env.SEED_USER_EMAIL }}" \
          --set config.sendGridFromEmail="$SENDGRID_FROM_EMAIL" \
          --set config.sendGridFromName="$SENDGRID_FROM_NAME" \
          --set secrets.jwtSecret="$JWT_SECRET" \
          --set secrets.seedUserPassword="$SEED_USER_PASSWORD" \
          --set secrets.aprovacaoTokenSecret="$APROVACAO_TOKEN_SECRET" \
          --set secrets.sendGridApiKey="$SENDGRID_API_KEY" \
          --set postgres.password="$POSTGRES_PASSWORD"

    - name: Configure URL Display
      run: |
        echo "Application is deployed. You can retrieve the load balancer URL using:"
        echo "kubectl get ingress"

  destroy:
    name: Auto-Destroy (Terraform & Helm Cleanup)
    needs: [infra, deploy]
    if: |
      always() &&
      (needs.infra.result == 'success' || needs.infra.result == 'failure') &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Wait 20 Minutes
      run: |
        echo "Waiting 20 minutes before destroying infrastructure..."
        sleep 1200

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      with:
        terraform_version: 1.5.0

    - name: Terraform Init
      working-directory: infra
      env:
        TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      run: |
        terraform init -backend-config="bucket=$TF_STATE_BUCKET"

    - name: Get Infrastructure Details
      id: get-infra-details
      working-directory: infra
      run: |
        CLUSTER_NAME=$(terraform output -raw cluster_name || echo "")
        VPC_ID=$(terraform output -raw vpc_id || echo "")
        echo "cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT
        echo "vpc_id=$VPC_ID" >> $GITHUB_OUTPUT

    - name: Setup Kubeconfig
      run: |
        CLUSTER_NAME="${{ steps.get-infra-details.outputs.cluster_name }}"
        if [ -z "$CLUSTER_NAME" ]; then
          CLUSTER_NAME="${{ needs.infra.outputs.cluster_name }}"
        fi
        if [ -n "$CLUSTER_NAME" ]; then
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region ${{ env.AWS_REGION }}
        else
          echo "No cluster name found, skipping kubeconfig update."
        fi

    - name: Uninstall Helm Releases
      run: |
        if kubectl cluster-info >/dev/null 2>&1; then
          echo "Connected to EKS cluster. Starting Helm cleanup..."
          
          # Desinstala o autoreparos aguardando a exclusão dos pods/recursos
          helm uninstall autoreparos --wait || true
          
          # Desinstala ingress-nginx e prometheus
          helm uninstall ingress-nginx -n ingress-nginx --wait || true
          helm uninstall prometheus -n monitoring --wait || true
          
          # Garante a remoção forçada de qualquer ingress ou serviço restante do tipo LoadBalancer
          kubectl delete ingress --all --all-namespaces || true
          kubectl delete service -n ingress-nginx ingress-nginx-controller || true
          kubectl delete service -n monitoring prometheus-grafana || true
        else
          echo "Cannot connect to EKS cluster. Skipping Helm/Kubernetes cleanup steps."
        fi

    - name: Wait for AWS Resources to be Released (Polling)
      run: |
        VPC_ID="${{ steps.get-infra-details.outputs.vpc_id }}"
        if [ -z "$VPC_ID" ]; then
          echo "VPC ID not found, skipping AWS resource polling."
          exit 0
        fi

        echo "VPC ID: $VPC_ID"

        # 1. Aguarda a deleção de todos os Load Balancers no VPC
        echo "Waiting for all Load Balancers in VPC $VPC_ID to be deleted..."
        while true; do
          LBS=$(aws elbv2 describe-load-balancers --query "LoadBalancers[?VpcId=='$VPC_ID'].LoadBalancerArn" --output text 2>/dev/null || echo "")
          if [ -z "$LBS" ]; then
            echo "All Load Balancers in VPC deleted."
            break
          fi
          echo "Still waiting for Load Balancers to be deleted: $LBS"
          sleep 10
        done

        # 2. Aguarda a deleção de todas as interfaces de rede (ENIs) de ELB no VPC
        echo "Waiting for all ELB network interfaces (ENIs) in VPC $VPC_ID to be deleted..."
        while true; do
          ENIS=$(aws ec2 describe-network-interfaces \
            --filters "Name=vpc-id,Values=$VPC_ID" "Name=description,Values='ELB net/*','ELB app/*','ELB *'" \
            --query "NetworkInterfaces[*].NetworkInterfaceId" \
            --output text 2>/dev/null || echo "")
          if [ -z "$ENIS" ]; then
            echo "All ELB ENIs in VPC deleted."
            break
          fi
          echo "Still waiting for ELB ENIs to be deleted: $ENIS"
          sleep 10
        done
        
        echo "All dynamically created AWS resources have been successfully deleted!"

    - name: Terraform Destroy
      working-directory: infra
      run: terraform destroy -auto-approve



