name: CI/CD Pipeline

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.dockerignore'
  pull_request:
    types: [ opened, reopened, synchronize ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.dockerignore'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"
  SEED_USER_EMAIL: "admin@autoreparos.com"

jobs:
  # 🛠️ Bloco 1: Compilação (Restore & Build)
  compilation:
    name: Compilação (Restore & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore AutoReparos.slnx

      - name: Build Application
        run: dotnet build AutoReparos.slnx --no-restore -c Release

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            **/bin/
            **/obj/
          retention-days: 1

  # 🧪 Bloco 2: Testes (Unitários & Integração)
  tests:
    name: Testes (Unitários & Integração)
    needs: compilation
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__DbConnection: "Host=localhost;Database=autoreparos_test;Username=admin;Password=${{ secrets.POSTGRES_PASSWORD }}"
      Jwt__Secret: ${{ secrets.JWT_SECRET }}
      Jwt__ExpiryHours: "2"
      SeedUser__Email: "admin@autoreparos.com"
      SeedUser__Password: ${{ secrets.SEED_USER_PASSWORD }}
      AprovacaoToken__Secret: ${{ secrets.APROVACAO_TOKEN_SECRET }}
      SendGrid__ApiKey: ${{ secrets.SENDGRID_API_KEY }}
      SendGrid__FromEmail: "noreply@autoreparos.com"
      SendGrid__FromName: "AutoReparos"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Run Unit Tests
        run: |
          dotnet test submodules/AutoReparos.App/AutoReparos.Domain.Tests/AutoReparos.Domain.Tests.csproj -c Release --no-build --verbosity normal
          dotnet test submodules/AutoReparos.App/AutoReparos.Application.Tests/AutoReparos.Application.Tests.csproj -c Release --no-build --verbosity normal
          dotnet test submodules/AutoReparos.AuthLambda/tests/AutoReparos.AuthLambda.Tests.csproj -c Release --no-build --verbosity normal

      - name: Run Integration Tests
        run: dotnet test submodules/AutoReparos.App/AutoReparos.IntegrationTests/AutoReparos.IntegrationTests.csproj -c Release --no-build --verbosity normal

  # ☁️ Bloco 3: Infraestrutura (Terraform & ECR Push)
  infra:
    name: Infraestrutura (Terraform & ECR Push)
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ecr_repository_url: ${{ steps.tf-outputs.outputs.ecr_repository_url }}
      cluster_name: ${{ steps.tf-outputs.outputs.cluster_name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validar Configuração OIDC
        run: |
          if [ -z "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "::error::Secret AWS_ROLE_ARN não configurado. Autenticação GitHub Actions OIDC requer a ARN da IAM Role configurada."
            exit 1
          fi

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Validate
        working-directory: submodules/AutoReparos.Infra.K8s/terraform
        run: |
          terraform init
          terraform validate

      - name: Terraform Apply
        working-directory: submodules/AutoReparos.Infra.K8s/terraform
        run: terraform apply -auto-approve

      - name: Get Terraform Outputs
        id: tf-outputs
        working-directory: submodules/AutoReparos.Infra.K8s/terraform
        run: |
          echo "ecr_repository_url=$(terraform output -raw ecr_repository_url)" >> $GITHUB_OUTPUT
          echo "cluster_name=$(terraform output -raw cluster_name)" >> $GITHUB_OUTPUT

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag and Push Container Images to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "=== Building and pushing Backend API image ==="
          docker build -t $ECR_REGISTRY/autoreparos-api:$IMAGE_TAG -t $ECR_REGISTRY/autoreparos-api:latest \
            -f submodules/AutoReparos.App/AutoReparos.API/Dockerfile submodules/AutoReparos.App
          docker push $ECR_REGISTRY/autoreparos-api:$IMAGE_TAG
          docker push $ECR_REGISTRY/autoreparos-api:latest

          echo "=== Building and pushing Frontend Web image ==="
          docker build -t $ECR_REGISTRY/autoreparos-web:$IMAGE_TAG -t $ECR_REGISTRY/autoreparos-web:latest \
            -f submodules/AutoReparos.App/AutoReparos.Web/Dockerfile submodules/AutoReparos.App/AutoReparos.Web
          docker push $ECR_REGISTRY/autoreparos-web:$IMAGE_TAG
          docker push $ECR_REGISTRY/autoreparos-web:latest

  # ☸️ Bloco 4: Deploy (Kubernetes & Helm)
  deploy:
    name: Deploy (Kubernetes & Helm)
    needs: infra
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validar Configuração OIDC
        run: |
          if [ -z "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "::error::Secret AWS_ROLE_ARN não configurado. Autenticação GitHub Actions OIDC requer a ARN da IAM Role configurada."
            exit 1
          fi

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ needs.infra.outputs.cluster_name }} --region ${{ env.AWS_REGION }}

      - name: Apply Kubernetes Secret via STDIN (Secure Injection)
        env:
          DB_CONNECTION: ${{ secrets.CONNECTION_STRING }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SEED_USER_PASSWORD: ${{ secrets.SEED_USER_PASSWORD }}
          APROVACAO_TOKEN_SECRET: ${{ secrets.APROVACAO_TOKEN_SECRET }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          set +x
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: Secret
          metadata:
            name: autoreparos-api-secrets
            namespace: default
          type: Opaque
          stringData:
            ConnectionStrings__DbConnection: "${DB_CONNECTION}"
            Jwt__Secret: "${JWT_SECRET}"
            SeedUser__Password: "${SEED_USER_PASSWORD}"
            AprovacaoToken__Secret: "${APROVACAO_TOKEN_SECRET}"
            SendGrid__ApiKey: "${SENDGRID_API_KEY}"
          EOF

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Helm Upgrade Deploy
        env:
          ECR_REGISTRY: ${{ needs.infra.outputs.ecr_repository_url }}
          SENDGRID_FROM_EMAIL: ${{ vars.SENDGRID_FROM_EMAIL || 'noreply@autoreparos.com' }}
          SENDGRID_FROM_NAME: ${{ vars.SENDGRID_FROM_NAME || 'AutoReparos' }}
        run: |
          helm upgrade --install autoreparos ./submodules/AutoReparos.Infra.K8s/k8s \
            -f submodules/AutoReparos.Infra.K8s/k8s/values.yaml \
            -f submodules/AutoReparos.Infra.K8s/k8s/values-production.yaml \
            --set api.image.repository="${ECR_REGISTRY}/autoreparos-api" \
            --set api.image.tag="${{ github.sha }}" \
            --set web.image.repository="${ECR_REGISTRY}/autoreparos-web" \
            --set web.image.tag="${{ github.sha }}" \
            --set api.config.seedUserEmail="${{ env.SEED_USER_EMAIL }}" \
            --set api.config.sendGridFromEmail="$SENDGRID_FROM_EMAIL" \
            --set api.config.sendGridFromName="$SENDGRID_FROM_NAME"

      - name: Configure URL Display
        run: |
          echo "Application is deployed. You can retrieve the load balancer URL using:"
          echo "kubectl get ingress"
