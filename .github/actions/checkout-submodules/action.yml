name: Checkout AutoReparos repositories
description: Checkout the parent and pinned recursive submodule commits, optionally using a GitHub App token
inputs:
  app-id:
    description: GitHub App ID; empty when all submodules are public
    required: false
    default: ''
  private-key:
    description: GitHub App private key; empty when all submodules are public
    required: false
    default: ''
runs:
  using: composite
  steps:
    - id: app-token
      if: inputs.app-id != ''
      uses: actions/create-github-app-token@v1.11.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: Grupo78-PosTech-15SOAT
        repositories: |
          AutoReparos
          AutoReparos.App
          AutoReparos.AuthLambda
          AutoReparos.Infra.Database
          AutoReparos.Infra.K8s
    - uses: actions/checkout@v4.2.2
      with:
        submodules: recursive
        token: ${{ steps.app-token.outputs.token || github.token }}
