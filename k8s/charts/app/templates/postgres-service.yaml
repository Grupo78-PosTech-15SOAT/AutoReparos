apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8s.fullname" . }}-postgres-service
  labels:
    {{- include "k8s.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: {{ include "k8s.fullname" . }}-postgres
