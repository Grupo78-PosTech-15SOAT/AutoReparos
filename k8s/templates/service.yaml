apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8s.fullname" . }}-service
  labels:
    {{- include "k8s.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "k8s.selectorLabels" . | nindent 4 }}
    app: {{ include "k8s.fullname" . }}-api
