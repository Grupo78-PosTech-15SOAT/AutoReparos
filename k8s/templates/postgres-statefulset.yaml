apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "k8s.fullname" . }}-postgres
  labels:
    {{- include "k8s.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "k8s.fullname" . }}-postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "k8s.fullname" . }}-postgres
  template:
    metadata:
      labels:
        app: {{ include "k8s.fullname" . }}-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "k8s.fullname" . }}-secrets
                  key: postgres-password
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: {{ include "k8s.fullname" . }}-postgres-pvc
