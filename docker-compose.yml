# Docker compose - PostgreSQL e API
services:
  postgres:
    image: postgres:16
    container_name: autoreparos-postgres
    restart: always
    environment:
      POSTGRES_DB: autoreparos
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - autoreparos-network

  # api:
  #   image: autoreparos-api
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: autoreparos-api
  #   restart: always
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Development
  #     - ConnectionStrings__DbConnection=Host=postgres;Database=autoreparos;Username=admin;Password=${DB_PASSWORD}
  #     - Jwt__Secret=${JWT_SECRET}
  #     - Jwt__ExpiryHours=${JWT_EXPIRY_HOURS}
  #     - SeedUser__Email=${SEED_USER_EMAIL}
  #     - SeedUser__Password=${SEED_USER_PASSWORD}
  #   ports:
  #     - "8080:8080"
