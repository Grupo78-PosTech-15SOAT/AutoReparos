# Docker compose - PostgreSQL - penas para desenvolvimento
services:
  postgres:
    image: postgres:16
    container_name: autoreparos-postgres
    restart: always
    environment:
      POSTGRES_DB: autoreparos
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "1q2w3e4r@#$"
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - autoreparos-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: autoreparos-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@autoreparos.com
      PGADMIN_DEFAULT_PASSWORD: "1q2w3e4r@#$"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - autoreparos-network

volumes:
  pg_data:
  pgadmin_data:

networks:
  autoreparos-network:
    driver: bridge