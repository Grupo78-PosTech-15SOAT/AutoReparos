name: Billing CI

on:
  pull_request:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']

permissions:
  contents: read

concurrency:
  group: billing-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore AutoReparos.Billing.slnx
      - run: dotnet build AutoReparos.Billing.slnx --no-restore -m:1 -c Release
      - run: dotnet test AutoReparos.Billing.Tests --no-build --no-restore -m:1 -c Release
      - run: dotnet format AutoReparos.Billing.slnx --verify-no-changes --no-restore
